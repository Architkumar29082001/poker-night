<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker Night</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f3f1ea;--fg:#1d2420;--mut:#6b746d;--pan:#fff;--felt:#1f6b4a;--felt2:#17543a;--acc:#c8962b;--line:#d9d5c8;--act:#e3f2e8;--red:#c62f2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121613;--fg:#ecece4;--mut:#98a39b;--pan:#1c231e;--felt:#1a5a3f;--felt2:#124230;--line:#2c352e;--act:#233a2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--fg:#ecece4;--mut:#98a39b;--pan:#1c231e;--felt:#1a5a3f;--felt2:#124230;--line:#2c352e;--act:#233a2b;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:1200px;margin:0 auto;padding:14px}
h1{font:700 22px Georgia,serif;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 12px}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.felt{background:radial-gradient(ellipse at center,var(--felt),var(--felt2));color:#fff;border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}
.board{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap;min-height:64px}
.pot{font-weight:700;color:#f3d98b}
.c{display:inline-flex;align-items:baseline;justify-content:center;gap:1px;width:42px;height:60px;background:#fff;color:#111;border-radius:6px;font:700 17px Georgia,serif;padding-top:6px;box-shadow:0 1px 3px #0005;box-sizing:border-box}
.c.r{color:#c62f2f}.c b{font-size:15px}
.c.bk{background:repeating-linear-gradient(45deg,#8a2b3c,#8a2b3c 4px,#6f2230 4px,#6f2230 8px);border:2px solid #fff}
.c.em{background:#ffffff18;box-shadow:none;border:1px dashed #fff5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pl{background:var(--pan);border:2px solid var(--line);border-radius:12px;padding:10px;position:relative}
.pl.turn{border-color:var(--acc);background:var(--act)}
.pl.me{outline:2px solid var(--felt)}
.pl.fold{opacity:.5}
.nm{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.ch{color:var(--mut)}
.cards{display:flex;gap:5px;margin-top:8px;min-height:60px}
.tag{font-size:11px;background:var(--acc);color:#fff;border-radius:99px;padding:1px 7px;margin-left:4px}
.bet{font-size:13px;margin-top:6px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:600 15px inherit;font-family:inherit;border:0;border-radius:9px;padding:10px 16px;background:var(--felt);color:#fff;cursor:pointer}
button.s{background:var(--line);color:var(--fg)}button.d{background:var(--red)}
button:disabled{opacity:.5}
input{font:inherit;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:110px}
input.n{width:160px}
.log{font-size:13px;color:#e8f1ea;max-height:110px;overflow:auto;margin-top:6px}
.note{color:var(--red);font-size:13px;margin:6px 0}
.msg{font-weight:600}
.c.sm{width:30px;height:42px;font-size:13px;padding-top:4px}.c.sm b{font-size:12px}
.rk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.rk .cards{margin:0;min-height:0}
details summary{cursor:pointer;font-weight:700}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;align-items:start}
@media(max-width:920px){.wrap{grid-template-columns:1fr}.sd{position:static!important}}
.sd{position:sticky;top:10px}.sd .hist{max-height:380px}
.stat{text-align:center;font-weight:700;margin:4px 0}
.tw{padding:36px 28px}
.tbl{position:relative;width:100%;aspect-ratio:16/10;background:#14291d;border-radius:999px;box-shadow:inset 0 0 0 6px #0c1a12,0 4px 14px #0004}
.tbl::before{content:"";position:absolute;inset:3.5%;border-radius:999px;background:radial-gradient(ellipse at center,var(--felt),var(--felt2))}
.tbl::after{content:"";position:absolute;inset:17% 12%;border-radius:999px;border:2px solid #ffffff22;pointer-events:none}
.ctr{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:64%}
.potc{display:flex;align-items:flex-end;justify-content:center;gap:6px;font-size:13px;color:#f3d98b;margin-bottom:4px;min-height:22px}
.board{margin:0;min-height:0;flex-wrap:nowrap}.board .c{width:44px;height:62px}
.seat{position:absolute;z-index:3;transform:translate(-50%,-50%);width:118px;background:#0b1f14e6;color:#fff;border:2px solid #ffffff22;border-radius:12px;padding:5px 6px;font-size:12px;line-height:1.25}
.seat.turn{border-color:var(--acc);box-shadow:0 0 0 3px #c8962b88}.seat.me{border-color:#9be3b3}.seat.fold{opacity:.45}
.who{display:flex;align-items:center;gap:5px;position:relative}
.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:18px;flex:none;border:2px solid #fff}
.wn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wn small{opacity:.8}
.dlr{position:absolute;right:-12px;top:-14px;background:#fff;color:#111;border-radius:50%;width:20px;height:20px;font:700 11px/20px system-ui;text-align:center;box-shadow:0 1px 3px #0006}
.seat .cards{margin:4px 0 3px;min-height:44px;justify-content:center}
.seat .c{width:30px;height:44px;font-size:13px;padding-top:4px}.seat .c b{font-size:12px}
.stk{display:flex;align-items:flex-end;gap:5px;justify-content:center;flex-wrap:wrap}
.piles{display:inline-flex;align-items:flex-end;gap:2px}.stack{display:inline-flex;flex-direction:column-reverse}
.stack i{display:block;width:18px;height:7px;border-radius:50%;border:2px dashed #fffd;margin-top:-4px;box-sizing:border-box;box-shadow:inset 0 0 0 1px #0004,0 1px 0 #0008}
.pos{position:absolute;right:-8px;top:-17px;display:flex;gap:3px}.pb{display:inline-block;border-radius:99px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;font:700 11px/20px system-ui;text-align:center;color:#fff;box-shadow:0 1px 3px #0006}.pb.d{background:#fff;color:#111}.pb.sb{background:#2a6fd6}.pb.bb{background:#d97706}
.win{text-align:center;background:linear-gradient(90deg,#c8962b,#f3d98b,#c8962b);color:#2b1d00;font-size:17px;padding:10px 12px;border-radius:12px;margin:6px 0;box-shadow:0 2px 10px #0003}
.seat.won{border-color:#ffd700;box-shadow:0 0 0 3px #ffd70099}select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.net{font-weight:700;border-radius:6px;padding:0 5px}.net.up{background:#2e8b57}.net.dn{background:#c0392b}
.bet{position:absolute;z-index:2;transform:translate(-50%,-50%);display:flex;align-items:flex-end;gap:4px;color:#f3d98b;font-size:12px;font-weight:700;margin:0}
.avs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ab{padding:6px 9px;font-size:22px;background:var(--line);border:2px solid transparent}.ab.on{border-color:var(--felt);background:var(--act)}
@media(max-width:700px){.tbl{aspect-ratio:3/4}.tw{padding:50px 4px}.seat{width:92px;font-size:11px}.board .c{width:32px;height:46px;font-size:13px}.seat .c{width:24px;height:36px;font-size:11px}.av{width:24px;height:24px;font-size:14px}.ctr{width:80%}}
.hist{max-height:240px;overflow:auto;margin-top:6px;font-size:14px}.hl{padding:3px 0;border-bottom:1px solid var(--line)}
.hb{background:var(--act)}
</style></head>
<body><main>
<h1>♠ Poker Night</h1>
<p class="sub">Texas Hold’em for 2–8 players · blinds set by the host (default 10/20)</p>
<div id="app"><div class="panel">Connecting to the table…</div></div>
</main>
<script>
(()=>{
const SB=10,BB=20,START=1000,RK='23456789TJQKA',SU='♠♥♦♣';
const HN=['High card','Pair','Two pair','Three of a kind','Straight','Flush','Full house','Four of a kind','Straight flush'];
const app=document.getElementById('app');
let S=null,me=null,ref=null,busy=false,err='',loaded=false,rv=0,rst=false;
const e=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fresh=()=>({ph:'lobby',p:[],b:[],h:0,d:-1,t:0,cur:0,min:BB,v:0,log:[],deck:[],hist:[],admin:null,start:START});
const cd=c=>`<span class="c ${(c/13|0)==1||(c/13|0)==2?'r':''}">${RK[c%13]=='T'?'10':RK[c%13]}<b>${SU[c/13|0]}</b></span>`;
const bk='<span class="c bk"></span>';

/* ---------- hand evaluation ---------- */
function ev(c){
  const r=c.map(x=>x%13).sort((a,b)=>b-a),f=c.every(x=>(x/13|0)==(c[0]/13|0));
  let st=0;
  if(new Set(r).size==5){if(r[0]-r[4]==4)st=r[0];else if(r.join()=='12,3,2,1,0')st=3}
  const m={};r.forEach(x=>m[x]=(m[x]||0)+1);
  const g=Object.entries(m).map(([k,v])=>[v,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  let k=g.map(x=>x[1]),cat;
  if(st&&f)cat=8;else if(g[0][0]==4)cat=7;else if(g[0][0]==3&&g[1][0]==2)cat=6;else if(f)cat=5;
  else if(st)cat=4;else if(g[0][0]==3)cat=3;else if(g[0][0]==2&&g[1][0]==2)cat=2;else if(g[0][0]==2)cat=1;else cat=0;
  if(st)k=[st];
  return [cat,...k];
}
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
function best(c){let b=null;const L=c.length;
  const go=(st,pk)=>{if(pk.length==5){const v=ev(pk);if(!b||cmp(v,b)>0)b=v;return}if(st>=L||pk.length+L-st<5)return;go(st+1,pk.concat(c[st]));go(st+1,pk)};
  go(0,[]);return b}

/* ---------- game engine (pure on a state copy) ---------- */
const n=s=>s.p.length;
const nxt=(s,i,fn)=>{for(let k=1;k<=n(s);k++){const j=((i+k)%n(s)+n(s))%n(s);if(fn(s.p[j]))return j}return i};
const live=s=>s.p.filter(p=>!p.f);
function pay(p,x){x=Math.min(x,p.chips);p.chips-=x;p.bet+=x;p.tot+=x;if(!p.chips)p.ai=true}
const lg=(s,t)=>{s.log.push(t);s.log=s.log.slice(-8);const w=s.p.find(p=>t.startsWith(p.n));(s.hist=s.hist||[]).push({h:s.h,n:w?w.n:'',t:w?t.slice(w.n.length):t,ts:Date.now(),b:w&&w.bot?1:0});s.hist=s.hist.slice(-150)};
function finish(s){s.res={h:s.h,list:s.p.filter(p=>p.won>0).map(p=>({n:p.n,amt:p.won,hn:p.hd||p.hn||''}))};s.ph=s.p.filter(p=>p.chips>0).length<2?'over':'show';
  if(s.ph=='over'){const w=s.p.find(p=>p.chips>0);if(w){s.champ=w.n;lg(s,`🏆 ${w.n} wins the game!`)}}}
function startHand(s){
  s.p.forEach(p=>{if(p.chips<=0)p.out=1});
  if(s.p.filter(p=>!p.out).length<2){s.ph='over';return}
  const dk=[...Array(52).keys()];
  for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[dk[i],dk[j]]=[dk[j],dk[i]]}
  s.h++;s.res=null;s.champ=null;s.b=[];s.log=['Hand #'+s.h];s.ph='play';
  s.p.forEach(p=>{p.c0=p.chips;p.won=0;p.f=!!p.out;p.ai=false;p.a=false;p.bet=0;p.tot=0;p.show=false;p.hn='';p.hd='';p.hole=p.out?[]:[dk.pop(),dk.pop()]});
  s.deck=dk;
  const ok=p=>!p.out,cnt=s.p.filter(ok).length;
  s.d=nxt(s,s.d,ok);
  const sb=cnt==2?s.d:nxt(s,s.d,ok),bb=nxt(s,sb,ok);
  const SBv=s.sbv||SB,BBv=SBv*2;s.sb=sb;s.bb=bb;pay(s.p[sb],SBv);pay(s.p[bb],BBv);s.cur=BBv;s.min=BBv;
  lg(s,`Hand #${s.h} dealt`);lg(s,`${s.p[s.d].n} is the dealer`);
  lg(s,`${s.p[sb].n} posts the small blind (${SBv})`);lg(s,`${s.p[bb].n} posts the big blind (${BBv})`);
  s.t=nxt(s,bb,p=>!p.f&&!p.ai);
  if(s.p.filter(p=>!p.f&&!p.ai).length<2)adv(s);
}
function showdown(s){
  s.p.forEach(p=>{if(!p.f){p.sc=best(p.hole.concat(s.b));p.hn=HN[p.sc[0]];p.hd=desc(p.sc);p.show=true;lg(s,`${p.n} shows ${desc(p.sc)} (${p.hole.map(ct).join(' ')})`)}});
  const lv=[...new Set(s.p.filter(p=>p.tot>0).map(p=>p.tot))].sort((a,b)=>a-b);let prev=0;
  for(const L of lv){
    let amt=0;s.p.forEach(p=>amt+=Math.min(p.tot,L)-Math.min(p.tot,prev));prev=L;
    let el=s.p.filter(p=>!p.f&&p.tot>=L);if(!el.length)el=live(s);
    let top=el[0].sc;el.forEach(p=>{if(cmp(p.sc,top)>0)top=p.sc});
    const ws=el.filter(p=>cmp(p.sc,top)==0),sh=Math.floor(amt/ws.length);
    ws.forEach(w=>{w.chips+=sh;w.won=(w.won||0)+sh});ws[0].chips+=amt-sh*ws.length;ws[0].won+=amt-sh*ws.length;
    lg(s,`${ws.map(w=>w.n).join(' & ')} win${ws.length>1?'':'s'} ${amt} with ${ws[0].hn}`);
  }
  finish(s);
}
function adv(s){
  const al=live(s);
  if(al.length==1){const w=al[0],amt=s.p.reduce((a,p)=>a+p.tot,0);w.chips+=amt;w.won=amt;lg(s,`${w.n} wins ${amt} (everyone folded)`);finish(s);return}
  const need=s.p.filter(p=>!p.f&&!p.ai);
  const done=need.length==0||(need.length==1&&need[0].bet>=s.cur)||need.every(p=>p.a&&p.bet==s.cur);
  if(!done){s.t=nxt(s,s.t,p=>!p.f&&!p.ai);return}
  for(;;){
    s.p.forEach(p=>{p.bet=0;p.a=false});s.cur=0;s.min=2*(s.sbv||SB);
    if(s.b.length==5)return showdown(s);
    const k=s.b.length==0?3:1;for(let i=0;i<k;i++)s.b.push(s.deck.pop());
    lg(s,`${s.b.length==3?'Flop':s.b.length==4?'Turn':'River'}: ${s.b.slice(-k).map(ct).join(' ')}`);
    if(need.length>=2){s.t=nxt(s,s.d,p=>!p.f&&!p.ai);return}
  }
}
function act(s,t,amt){
  const p=s.p[s.t];
  if(t=='f'){p.f=true;lg(s,`${p.n} folds`)}
  else if(t=='c'){const x=Math.min(s.cur-p.bet,p.chips);pay(p,x);lg(s,x?`${p.n} calls ${x}`:`${p.n} checks`)}
  else{
    const tg=Math.min(Math.max(amt|0,0),p.bet+p.chips),prev=s.cur;
    pay(p,tg-p.bet);
    if(p.bet>prev){if(p.bet-prev>=s.min)s.min=p.bet-prev;s.cur=p.bet;s.p.forEach(q=>{if(q!==p)q.a=false})}
    lg(s,`${p.n} ${prev?'raises to':'bets'} ${p.bet}${p.ai?' (all-in)':''}`);
  }
  p.a=true;adv(s);
}

/* ---------- hand names, ranking guide, bots ---------- */
let rkOpen=false,bk2='',hide=false;
app.addEventListener('toggle',x=>{rkOpen=x.target.open},true);
const NM=['Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Jack','Queen','King','Ace'],pl=x=>x=='Six'?'Sixes':x+'s';
function desc(sc){const k=sc.slice(1),n=i=>NM[k[i]];
  return [`${n(0)} high`,`Pair of ${pl(n(0))}`,`Two pair, ${pl(n(0))} and ${pl(n(1))}`,`Three ${pl(n(0))}`,`Straight, ${n(0)} high`,`Flush, ${n(0)} high`,`Full house, ${pl(n(0))} over ${pl(n(1))}`,`Four ${pl(n(0))}`,k[0]==12?'Royal flush':`Straight flush, ${n(0)} high`][sc[0]]}
function banner(s,mp){
  if(!mp||mp.out||!mp.hole.length||s.ph=='lobby'||(s.ph=='play'&&mp.f))return '';
  let t;
  if(!s.b.length){const a=mp.hole[0]%13,b=mp.hole[1]%13,su=(mp.hole[0]/13|0)==(mp.hole[1]/13|0);t=a==b?`Pair of ${pl(NM[a])}`:`${NM[Math.max(a,b)]} high${su?', suited':''}`}
  else t=desc(best(mp.hole.concat(s.b)));
  return `<div class="panel hb">Your best hand right now: <b>${t}</b> <span class="ch">(${s.b.length?'your 2 cards + '+s.b.length+' shared':'waiting for the flop'})</span></div>`}
const RANKS=[['Royal flush','A, K, Q, J, 10, all one suit','every other hand',[25,24,23,22,21]],['Straight flush','Five in a row, all one suit','everything below it',[7,6,5,4,3]],['Four of a kind','All four cards of one rank','full house and below',[10,23,36,49,5]],['Full house','Three of one rank plus a pair','flush and below',[9,22,35,41,2]],['Flush','Any five cards of one suit','straight and below',[38,35,32,30,26]],['Straight','Five in a row, mixed suits','three of a kind and below',[6,18,30,42,2]],['Three of a kind','Three cards of one rank','two pair and below',[7,20,33,50,4]],['Two pair','Two different pairs','one pair and high card',[12,25,31,44,10]],['Pair','Two cards of one rank','high card only',[8,21,38,45,1]],['High card','Nothing made, so your best card plays','a lower high card',[12,23,33,42,0]]];
function rankPanel(){return `<details class="panel" ${rkOpen?'open':''}><summary>Poker hand rankings (best to worst)</summary>${RANKS.map((r,i)=>`<div class="rk"><div><b>${i+1}. ${r[0]}</b><br><span class="ch">${r[1]} · beats ${r[2]}</span></div><div class="cards">${r[3].map(c=>cd(c).replace('class="c ','class="c sm ')).join('')}</div></div>`).join('')}<p class="ch" style="margin:8px 0 0;font-size:13px">Ace plays high, or low only in A-2-3-4-5. No suit outranks another. Equal hands are decided by the higher cards, then the kicker; exactly five cards play, and identical hands split the pot. Rules from pokerskill.com.</p></details>`}
const PERS={
  agg:{n:'Aggressive',ic:'🔥',adj:.15,fk:.9,fp:.7,rs:.55,rp:.65,bl:.2,sz:.8,nz:0,ai:.02},
  safe:{n:'Secure',ic:'🛡️',adj:-.05,fk:1.7,fp:.95,rs:.82,rp:.4,bl:0,sz:.4,nz:0,ai:0},
  newbie:{n:'Newbie',ic:'🐣',adj:0,fk:.6,fp:.5,rs:.7,rp:.25,bl:.12,sz:.3,nz:.35,ai:.03}};
function botAct(s){
  const p=s.p[s.t],P=PERS[p.pers]||PERS.safe,u=s.sbv||SB,need=Math.min(s.cur-p.bet,p.chips),pot=s.p.reduce((a,q)=>a+q.tot,0),maxR=p.bet+p.chips,r=Math.random();
  let st;
  if(!s.b.length){const a=p.hole[0]%13,b=p.hole[1]%13;st=(a+b)/48+(a==b?.4:0)+((p.hole[0]/13|0)==(p.hole[1]/13|0)?.05:0)+(Math.abs(a-b)<=2?.05:0)}
  else st=[.15,.4,.6,.72,.8,.85,.92,.97,1][best(p.hole.concat(s.b))[0]];
  st=Math.min(1,Math.max(0,st+P.adj+(Math.random()-.5)*2*P.nz));
  const ratio=need/((pot+need)||1);
  const rz=()=>act(s,'r',Math.min(Math.max(s.cur+s.min,s.cur+Math.round(pot*P.sz*(.5+r)/u)*u),maxR));
  if(maxR>s.cur&&Math.random()<P.ai)act(s,'r',maxR);
  else if(need==0){if(maxR>s.cur&&((st>P.rs&&r<P.rp)||r<P.bl))rz();else act(s,'c')}
  else if(st<ratio*P.fk&&r<P.fp)act(s,'f');
  else if(st>P.rs&&r<P.rp*.8&&maxR>s.cur)rz();
  else act(s,'c');
}
function botTick(){
  const s=S;if(!s||s.ph!='play'||busy)return;
  const p=s.p[s.t];if(!p||!p.bot)return;
  const drv=s.p.find(x=>!x.bot);if(!drv||drv.id!=me)return;
  const key=s.v+':'+s.t;if(bk2==key)return;bk2=key;
  const go=()=>{if(!S||S.v+':'+S.t!=key)return;if(busy)return setTimeout(go,400);W(x=>{if(x.ph=='play'&&x.p[x.t].bot)botAct(x)})};
  setTimeout(go,1000+Math.random()*900);
}

/* ---------- storage ---------- */
async function W(fn){
  if(busy||!ref)return;busy=true;err='';
  try{const pv=S||fresh(),s=JSON.parse(JSON.stringify(pv));fn(s);if(!(adm(pv)==me||(!pv.admin&&!pv.p.length))){s.admin=pv.admin;s.start=pv.start;s.sbv=pv.sbv}s.v++;S=s;render();await ref.set({s:JSON.stringify(s)})}
  catch(x){err='Could not save: '+(x&&(x.message||x.code)||'unknown error')}
  finally{busy=false;render()}
}

  code=c;S=null;loaded=false;err='';cp='';

  hs=(A?(logF?hs.filter(x=>x.n==logF):hs):hs.filter(x=>x.h==s.h)).slice().reverse();
  const head=A?`<b>Activity log</b> <span class="ch">— host view, all hands</span><div style="margin:6px 0"><select id="lf"><option value="">All players</option>${s.p.map(p=>`<option ${p.n==logF?'selected':''}>${e(p.n)}</option>`).join('')}</select></div>`:`<b>This hand</b> <span class="ch">— who did what (the host sees the full log)</span>`;
  return `<div class="panel">${head}<div class="hist">${hs.length?hs.map(x=>`<div class="hl"><span class="ch">${new Date(x.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span> ${x.h?'<span class="tag">#'+x.h+'</span> ':''}${x.n?'<b>'+e(x.n)+'</b>':''}${e(x.t)}${x.b?' 🤖':''}</div>`).join(''):'<span class="ch">Nothing yet — every join, bet, fold and win will be listed here.</span>'}</div></div>`}

/* ---------- peer-to-peer backend (WebRTC via PeerJS) ----------
   The party creator's browser is the "server": it keeps the game state and
   relays it to everyone who joins with the party code. No accounts needed. */
function p2pDoc(code,host){
  const cbs=[],ecbs=[],id='pokernight-'+code.toLowerCase(),sk='pk-state-'+code;
  let cur=null,conns=[],peer=null,hconn=null;
  const emit=()=>cbs.forEach(f=>f({exists:cur!=null,data:()=>({s:cur})}));
  const fail=m=>ecbs.forEach(f=>f({code:m}));
  const save=()=>{try{localStorage.setItem(sk,cur)}catch(_){}};
  const push=()=>conns.forEach(o=>{if(o.open!==false){try{o.send({t:'s',s:cur})}catch(_){}}});
  if(host){
    try{cur=localStorage.getItem(sk)}catch(_){}
    peer=new Peer(id);
    peer.on('open',()=>emit());
    peer.on('error',x=>fail(x.type=='unavailable-id'?'this party code is still registered — wait a few seconds and reload':x.type));
    peer.on('connection',c=>{
      conns.push(c);
      c.on('open',()=>c.send({t:'s',s:cur}));
      c.on('data',m=>{if(m&&m.t=='set'&&typeof m.s=='string'){cur=m.s;save();emit();push()}});
      c.on('close',()=>{conns=conns.filter(o=>o!==c)});
    });
  }else{
    peer=new Peer();
    peer.on('open',()=>{
      hconn=peer.connect(id,{reliable:true});
      hconn.on('data',m=>{if(m&&m.t=='s'){cur=m.s;emit()}});
      hconn.on('close',()=>fail('the host left the game'));
    });
    peer.on('error',x=>fail(x.type=='peer-unavailable'?'party not found — ask the host to open the game first':x.type));
  }
  return{
    onSnapshot(cb,ecb){cbs.push(cb);if(ecb)ecbs.push(ecb);return()=>{try{peer.destroy()}catch(_){}}},
    set(o){
      if(host){cur=o.s;save();emit();push();return Promise.resolve()}
      if(hconn&&hconn.open){cur=o.s;hconn.send({t:'set',s:o.s});return Promise.resolve()}
      return Promise.reject(new Error('Not connected to the host'));
    }
  };
}

/* ---------- connect ---------- */
(async()=>{
  try{
    try{me=sessionStorage.getItem('pk')||localStorage.getItem('pk')}catch(_){}
    if(!me)me='g'+Math.random().toString(36).slice(2,10);
    try{sessionStorage.setItem('pk',me)}catch(_){}
    if(typeof Peer=='undefined'){err='Could not load the PeerJS library — check your internet connection and reload.';loaded=true;render();return}
    DB={doc:path=>{const c=path.split('/')[1];let was=false;try{was=localStorage.getItem('pk-state-'+c)!=null}catch(_){}const h=!!window.__host||was;window.__host=false;return p2pDoc(c,h)}};
    const c0=hc();if(c0)openParty(c0);else{loaded=true;render()}
  }catch(x){err='Startup problem: '+((x&&x.message)||x);loaded=true;render()}
})();
})();
